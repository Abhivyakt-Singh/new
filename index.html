<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rizq Menu</title>
<meta name="description" content="Rizq — Food, Beverage and Shisha menu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110a0f;--card:#22141d;--card2:#2b1a25;--line:rgba(244,160,58,.18);
  --gold:#f4a03a;--gold2:#ffd08a;--cream:#f6ead7;--muted:#b9a79a;--veg:#2fd36b;--radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(244,160,58,.10), transparent 60%),
    radial-gradient(900px 600px at -10% 20%, rgba(120,50,90,.22), transparent 60%),
    var(--bg);
  color:var(--cream);font-family:"Jost",system-ui,sans-serif;font-weight:400;line-height:1.5;min-height:100vh;overflow-x:hidden;
}
@media (pointer:fine){ body, a, button, input, label, .pcard{cursor:none} }
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:900;box-shadow:0 0 12px var(--gold)}
.cursor,.cursor-dot{position:fixed;top:0;left:0;pointer-events:none;z-index:1999;border-radius:50%;transform:translate(-100px,-100px)}
.cursor{width:38px;height:38px;border:1.5px solid var(--gold);transition:width .25s,height .25s,background .25s,border-color .25s,margin .25s;margin:-19px 0 0 -19px}
.cursor-dot{width:6px;height:6px;background:var(--gold);margin:-3px 0 0 -3px}
.cursor.hover{width:62px;height:62px;margin:-31px 0 0 -31px;background:rgba(244,160,58,.14)}
.cursor.drag{width:70px;height:70px;margin:-35px 0 0 -35px;background:rgba(244,160,58,.22);border-color:var(--gold2)}
@media (pointer:coarse){.cursor,.cursor-dot{display:none}}

.top{position:sticky;top:0;z-index:100;background:rgba(17,10,15,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-row{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:28px;letter-spacing:.32em;color:var(--gold);text-decoration:none;margin-right:auto}
.brand small{display:block;font-family:"Jost";font-size:9px;letter-spacing:.5em;color:var(--muted);font-weight:400;margin-top:-4px}
.switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.switch button{background:none;border:0;color:var(--muted);font:500 13px "Jost";letter-spacing:.16em;text-transform:uppercase;padding:9px 20px;border-radius:999px;transition:.25s}
.switch button.on{background:linear-gradient(135deg,var(--gold),#e07c1a);color:#1b0d05;box-shadow:0 4px 18px rgba(244,160,58,.35)}
.tools{display:flex;gap:10px;align-items:center}
.search{background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--cream);font:400 14px "Jost";padding:10px 18px;width:210px;outline:none;transition:.25s}
.search:focus{border-color:var(--gold);width:250px}
.search::placeholder{color:#8c7a70}
.vegtoggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);user-select:none;white-space:nowrap}
.vegtoggle input{display:none}
.vegtoggle .sw{width:40px;height:22px;border-radius:99px;background:#3a2832;position:relative;transition:.25s;border:1px solid var(--line)}
.vegtoggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.25s}
.vegtoggle input:checked + .sw{background:rgba(47,211,107,.25);border-color:var(--veg)}
.vegtoggle input:checked + .sw::after{left:20px;background:var(--veg)}
.chips-wrap{border-top:1px solid rgba(244,160,58,.08)}
.chips{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;user-select:none;-webkit-user-select:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 12.5px "Jost";letter-spacing:.06em;padding:7px 15px;border-radius:999px;transition:.25s;white-space:nowrap;text-decoration:none}
.chip:hover{color:var(--gold2);border-color:var(--gold)}
.chip.on{background:var(--gold);color:#1b0d05;border-color:var(--gold);font-weight:600}

.hero{max-width:1280px;margin:0 auto;padding:70px 20px 30px;text-align:center}
.hero .eyebrow{letter-spacing:.55em;font-size:12px;color:var(--gold);text-transform:uppercase}
.hero h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(54px,11vw,128px);line-height:1;margin:10px 0 6px;letter-spacing:.06em;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#b8661a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-weight:300;letter-spacing:.2em;font-size:14px;text-transform:uppercase}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px auto 0;color:var(--gold)}
.orn::before,.orn::after{content:"";height:1px;width:min(120px,22vw);background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}
.stats{display:flex;justify-content:center;gap:34px;margin-top:26px;flex-wrap:wrap}
.stats div{font-family:"Cormorant Garamond",serif;font-size:34px;color:var(--cream);line-height:1}
.stats span{display:block;font-family:"Jost";font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:20px;letter-spacing:.06em}
.legend span{display:flex;align-items:center;gap:7px}

main{max-width:1280px;margin:0 auto;padding:0 20px 40px}
.section{padding-top:40px}
.section-head{display:flex;align-items:flex-end;gap:18px;margin:30px 0 8px}
.section-head h2{font-family:"Cormorant Garamond",serif;font-size:clamp(40px,7vw,76px);font-weight:600;line-height:1;color:var(--cream)}
.section-head h2 em{color:var(--gold);font-style:normal}
.section-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-bottom:14px}
.group{margin-top:44px}
.group-title{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:14px;margin-bottom:18px}
.group-title::after{content:"";flex:1;height:1px;background:var(--line)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:22px}

.rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease,border-color .3s,box-shadow .3s}
.rv.in{opacity:1;transform:none}
.cat,.gal{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);position:relative;overflow:hidden;scroll-margin-top:150px}
.cat{padding:26px 24px 14px}
.gal{grid-column:1/-1;padding:26px 22px 24px}
.cat:hover,.gal:hover{border-color:rgba(244,160,58,.4)}
.cat::before,.gal::before{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(244,160,58,.14),transparent 70%);pointer-events:none}
.cat h3,.gal h3{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:28px;color:var(--gold2);line-height:1.15;padding-right:44px}
.note{font-size:11.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.count{position:absolute;right:20px;top:22px;font-size:11px;letter-spacing:.2em;color:var(--muted)}
.items{list-style:none;margin-top:14px}
.item{padding:11px 0;border-top:1px dashed rgba(244,160,58,.16)}
.item:first-child{border-top:0}
.line{display:flex;align-items:baseline;gap:10px}
.name{font-weight:500;font-size:16px;color:var(--cream);display:flex;align-items:center;gap:8px}
.dots{flex:1;border-bottom:1px dotted rgba(246,234,215,.25);transform:translateY(-4px);min-width:14px}
.price{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:20px;color:var(--gold);white-space:nowrap}
.tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.s{color:#1b0d05;background:var(--gold);border-color:var(--gold);font-weight:600}
.tag.g{color:#e7c98f}
.tag.n{color:#8fe3ae;border-color:rgba(47,211,107,.35)}
.tag.note{color:var(--gold2);border-color:rgba(244,160,58,.35)}
.vd{flex:none;width:15px;height:15px;border:1.5px solid var(--veg);border-radius:3px;display:inline-grid;place-items:center}
.vd::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--veg)}
.item:hover .name{color:var(--gold2)}

/* photo cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,255px),1fr));gap:18px;margin-top:20px;list-style:none}
.pcard{background:#1a0e16;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .35s,border-color .35s,box-shadow .35s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-5px);border-color:rgba(244,160,58,.6);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.ph{aspect-ratio:16/10;background:#120a10;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease}
.pcard:hover .ph img{transform:scale(1.07)}
.ph.zoom{cursor:zoom-in}
.ph.empty{display:grid;place-items:center;background:linear-gradient(145deg,#3a1f2e,#1d0f18)}
.ph.empty span{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:34px;letter-spacing:.35em;padding-left:.35em;color:rgba(244,160,58,.4);border:1px solid rgba(244,160,58,.25);padding:6px 10px 6px 20px;border-radius:8px}
.ph .badge{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.ph .badge .vd{background:rgba(17,10,15,.7);width:18px;height:18px;border-radius:4px}
.pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pb .line{align-items:flex-start;justify-content:space-between;gap:12px}
.pb .name{font-size:15.5px;line-height:1.3;align-items:flex-start}
.pb .price{font-size:19px}
.pb .tags{margin-top:0}
.empty-msg{text-align:center;color:var(--muted);padding:80px 0;font-size:18px;letter-spacing:.1em}
.end{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.3em;text-transform:uppercase;padding:30px 0 60px}

#up{position:fixed;right:20px;bottom:20px;z-index:90;width:46px;height:46px;border-radius:50%;background:var(--gold);color:#1b0d05;border:0;font-size:20px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;transform:translateY(10px);box-shadow:0 8px 24px rgba(244,160,58,.35)}
#up.show{opacity:1;pointer-events:auto;transform:none}

/* lightbox */
#lb{position:fixed;inset:0;z-index:1500;background:rgba(10,5,8,.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:14px}
#lb.open{display:flex}
#lb img{max-width:min(94vw,1100px);max-height:76vh;border-radius:14px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.7);object-fit:contain}
#lb .cap{font-family:"Cormorant Garamond",serif;font-size:30px;color:var(--gold2);text-align:center}
#lb .cap b{color:var(--gold);margin-left:14px}
#lb .x{position:absolute;right:18px;top:14px;background:none;border:1px solid var(--line);color:var(--cream);width:42px;height:42px;border-radius:50%;font-size:20px}

@media (max-width:720px){
  .top-row{padding:10px 14px;gap:10px}
  .brand{font-size:22px;letter-spacing:.26em}
  .switch button{padding:8px 13px;font-size:11.5px;letter-spacing:.1em}
  .tools{width:100%}
  .search{flex:1;width:auto}
  .search:focus{width:auto}
  .chips{padding:9px 14px}
  .hero{padding-top:44px}
  main{padding:0 14px 30px}
  .cat{padding:22px 18px 10px}
  .gal{padding:22px 14px 18px}
  .cats{gap:16px}
  .name{font-size:15px}
  .cat,.gal{scroll-margin-top:190px}
  .pgrid{grid-template-columns:repeat(2,1fr);gap:12px}
  .pb{padding:10px 10px 12px}
  .pb .name{font-size:14px}
  .pb .price{font-size:16px}
  .pb .line{flex-direction:column;gap:2px}
  .ph.empty span{font-size:22px}
}
@media (max-width:360px){.pgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}}
</style>
</head>

const MAIN = {food:FOOD, beverages:BEV, shisha:SHISHA};
const TITLES = {food:["Fo","od"], beverages:["Bever","ages"], shisha:["Shi","sha"]};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const money = p => "₹" + p.toLocaleString("en-IN");
const count = d => d.reduce((a,g)=>a+g.cats.reduce((b,c)=>b+c.items.length,0),0);
$("#sFood").firstChild.textContent = count(FOOD);
$("#sBev").firstChild.textContent = count(BEV);
$("#sShi").firstChild.textContent = count(SHISHA);

let query = "", vegOnly = false, activeMain = "food";

function visibleData(key){
  const q = query.trim().toLowerCase();
  const out = [];
  MAIN[key].forEach(g=>{
    const cats = [];
    g.cats.forEach(c=>{
      const items = c.items.filter(it=>{
        if(vegOnly && key==="food" && !it[2].includes("v")) return false;
        if(q && !(it[0].toLowerCase().includes(q) || c.name.toLowerCase().includes(q) || g.group.toLowerCase().includes(q))) return false;
        return true;
      });
      if(items.length) cats.push({...c, items, id:slug(key+"-"+g.group+"-"+c.name)});
    });
    if(cats.length) out.push({group:g.group, cats});
  });
  return out;
}
function tagsHTML(it){
  const [name,prices,tags,note]=it, t=[];
  if(tags.includes("s")) t.push('<span class="tag s">Signature</span>');
  if(tags.includes("g")) t.push('<span class="tag g">Gluten Free</span>');
  if(tags.includes("n")) t.push('<span class="tag n">Vegan</span>');
  if(note) t.push('<span class="tag note">'+esc(note)+'</span>');
  return t.length ? '<div class="tags">'+t.join("")+'</div>' : '';
}
const priceTxt = it => it[1].map(money).join(" / ");
function listItem(it){
  return '<li class="item"><div class="line"><span class="name">'+(it[2].includes("v")?'<i class="vd" title="Vegetarian"></i>':'')+esc(it[0])+
    '</span><span class="dots"></span><span class="price">'+priceTxt(it)+'</span></div>'+tagsHTML(it)+'</li>';
}
function photoCard(it){
  const img = it[4];
  const ph = img
    ? '<div class="ph zoom" data-img="'+esc(img)+'" data-name="'+esc(it[0])+'" data-price="'+esc(priceTxt(it))+'"><img src="'+esc(img)+'" alt="'+esc(it[0])+'" loading="lazy" decoding="async"></div>'
    : '<div class="ph empty"><span>RIZQ</span></div>';
  const veg = it[2].includes("v") ? '<i class="vd" title="Vegetarian"></i>' : '';
  return '<li class="pcard">'+ph+'<div class="pb"><div class="line"><span class="name">'+veg+esc(it[0])+'</span><span class="price">'+priceTxt(it)+'</span></div>'+tagsHTML(it)+'</div></li>';
}
function sectionHTML(key){
  const data = visibleData(key), [a,b] = TITLES[key];
  let h = '<section class="section" id="'+key+'" data-main="'+key+'"><div class="section-head"><h2>'+a+'<em>'+b+'</em></h2><div class="rule"></div></div>';
  if(!data.length) h += '<div class="empty-msg">No items match your search.</div>';
  data.forEach(g=>{
    h += '<div class="group"><div class="group-title">'+esc(g.group)+'</div><div class="cats">';
    g.cats.forEach(c=>{
      const gallery = c.items.some(it=>it[4]);
      const head = '<h3>'+esc(c.name)+'</h3>'+(c.note?'<div class="note">'+esc(c.note)+'</div>':'')+'<span class="count">'+String(c.items.length).padStart(2,"0")+'</span>';
      if(gallery){
        h += '<article class="gal rv" id="'+c.id+'" data-main="'+key+'">'+head+'<ul class="pgrid">'+c.items.map(photoCard).join("")+'</ul></article>';
      } else {
        h += '<article class="cat rv" id="'+c.id+'" data-main="'+key+'">'+head+'<ul class="items">'+c.items.map(listItem).join("")+'</ul></article>';
      }
    });
    h += '</div></div>';
  });
  return h + '</section>';
}
function render(){
  $("#menu").innerHTML = sectionHTML("food") + sectionHTML("beverages") + sectionHTML("shisha");
  buildChips(activeMain);
  observe();
}
function buildChips(key){
  const data = visibleData(key), names = {};
  data.forEach(g=>g.cats.forEach(c=>names[c.name]=(names[c.name]||0)+1));
  $("#chips").innerHTML = data.flatMap(g=>g.cats.map(c=>
    '<a class="chip" href="#'+c.id+'" data-id="'+c.id+'">'+esc(c.name)+(names[c.name]>1?' · '+esc(g.group):'')+'</a>')).join("");
}
function setMain(key){
  if(key===activeMain) return;
  activeMain = key;
  document.querySelectorAll("#switch button").forEach(b=>b.classList.toggle("on", b.dataset.go===key));
  buildChips(key); $("#chips").scrollLeft = 0;
}
let io, io2;
function observe(){
  if(io) io.disconnect(); if(io2) io2.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }),{threshold:.04});
  document.querySelectorAll(".rv").forEach(c=>io.observe(c));
  io2 = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(!e.isIntersecting) return;
      setMain(e.target.dataset.main);
      document.querySelectorAll(".chip").forEach(ch=>{
        const on = ch.dataset.id===e.target.id;
        ch.classList.toggle("on", on);
        if(on){ const box=$("#chips"); box.scrollTo({left:ch.offsetLeft-box.clientWidth/2+ch.clientWidth/2, behavior:"smooth"}); }
      });
    });
  },{rootMargin:"-32% 0px -60% 0px"});
  document.querySelectorAll(".cat,.gal").forEach(c=>io2.observe(c));
  hoverTargets();
}
/* controls */
document.querySelectorAll("#switch button").forEach(b=>b.addEventListener("click",()=>{
  const t = document.getElementById(b.dataset.go); if(t) t.scrollIntoView({behavior:"smooth", block:"start"});
}));
$("#q").addEventListener("input",e=>{ query=e.target.value; render(); });
$("#veg").addEventListener("change",e=>{ vegOnly=e.target.checked; render(); });
$("#chips").addEventListener("click",e=>{
  const a = e.target.closest(".chip"); if(!a) return; e.preventDefault();
  if(moved>6) return;
  document.getElementById(a.dataset.id)?.scrollIntoView({behavior:"smooth", block:"start"});
});
/* cursor-based scrolling: drag the category bar, wheel scrolls it sideways */
const chips = $("#chips"), cur=$("#cur"), dot=$("#dot");
let down=false, startX=0, startL=0, moved=0;
chips.addEventListener("mousedown",e=>{ down=true; moved=0; startX=e.pageX; startL=chips.scrollLeft; cur.classList.add("drag"); });
window.addEventListener("mouseup",()=>{ down=false; cur.classList.remove("drag"); });
window.addEventListener("mousemove",e=>{ if(!down) return; const dx=e.pageX-startX; moved=Math.max(moved,Math.abs(dx)); chips.scrollLeft=startL-dx; });
chips.addEventListener("wheel",e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ chips.scrollLeft += e.deltaY; e.preventDefault(); } },{passive:false});
/* custom cursor */
let mx=0,my=0,cx=0,cy=0;
if(matchMedia("(pointer:fine)").matches){
  window.addEventListener("mousemove",e=>{ mx=e.clientX; my=e.clientY; dot.style.transform="translate("+mx+"px,"+my+"px)"; });
  (function loop(){ cx+=(mx-cx)*.16; cy+=(my-cy)*.16; cur.style.transform="translate("+cx+"px,"+cy+"px)"; requestAnimationFrame(loop); })();
}
function hoverTargets(){
  document.querySelectorAll(".item,.pcard,.chip").forEach(el=>{
    el.addEventListener("mouseenter",()=>cur.classList.add("hover"));
    el.addEventListener("mouseleave",()=>cur.classList.remove("hover"));
  });
}
document.querySelectorAll("button,a,input,label").forEach(el=>{
  el.addEventListener("mouseenter",()=>cur.classList.add("hover"));
  el.addEventListener("mouseleave",()=>cur.classList.remove("hover"));
});
/* lightbox */
const lb=$("#lb");
function closeLb(){ lb.classList.remove("open"); document.body.style.overflow=""; }
document.addEventListener("click",e=>{
  const z=e.target.closest(".ph.zoom");
  if(z){ lb.querySelector("img").src=z.dataset.img; lb.querySelector("img").alt=z.dataset.name;
    lb.querySelector(".cap").innerHTML=esc(z.dataset.name)+'<b>'+esc(z.dataset.price)+'</b>';
    lb.classList.add("open"); document.body.style.overflow="hidden"; return; }
  if(lb.classList.contains("open") && !e.target.closest("#lb img")) closeLb();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeLb(); });
/* progress + back to top */
const up=$("#up"), prog=$("#progress");
addEventListener("scroll",()=>{
  const h=document.documentElement;
  prog.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+"%";
  up.classList.toggle("show", h.scrollTop>700);
},{passive:true});
up.addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));
render();
</script>
